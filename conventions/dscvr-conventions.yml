  supported: false
  detail: >-
    No cursor/offset pagination is exposed in the current schema. Queries fetch single entities
    (user, content, portal) by id/name/slug; collection fields (roles, wallets) return full lists.
caching:
  detail: >-
    Docs recommend disabling client-side caching for real-time accuracy of social data.
error_envelope:
  format: graphql-errors
  detail: >-
    Errors follow the GraphQL specification — a top-level "errors" array alongside partial "data".
    This is not RFC 9457 problem+json.
