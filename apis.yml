aid: dscvr
name: DSCVR
description: "DSCVR (pronounced \"discover\") is a Web3 social platform that blends a Web2-style\
  \ social experience with crypto-native ownership, monetization, and distribution. Users post and\
  \ interact inside token-gated communities called Portals, earn DSCVR Points and daily streaks, and\
  \ connect on-chain wallets across Solana and the Internet Computer. For developers, DSCVR exposes a\
  \ public GraphQL API over its SocialFi graph — users, portals, content, wallets, reactions,\
  \ and frame messages — alongside the DSCVR Canvas / Frames framework for embedding interactive\
  \ mini-apps directly into the social feed, all backed by first-party TypeScript SDKs."
